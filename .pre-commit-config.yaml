repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff release CI resolves, or the hook's --fix
    # and CI's check will disagree about import sorting.
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies:
          # Keep these floors identical to the runtime pins in pyproject.toml, or
          # the hook type-checks against an API surface the package does not
          # support. `textual` read `>=0.53` here against a declared `>=0.86` --
          # and 0.86 is not an arbitrary floor: pyproject explains that the suite
          # relies on introspection APIs textual only added at 2.0, so 0.53 is
          # below what the code needs, not merely older than it. Harmless today
          # only because pip resolves the range upward; a pinned or offline
          # resolve would have taken the floor.
          - textual>=0.86,<9
          - pynvml>=11.5,<12
          - types-python-dateutil
