[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "slurmwatch"
description = "Live, process-isolated node-local hardware telemetry for active Slurm jobs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# authors = [{ name = "Youzhi Yu", email = "yuyouzhi666@icloud.com" }]
authors = [{ name = "Youzhi Yu" }]
keywords = ["slurm", "hpc", "monitoring", "gpu", "tui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    # >=0.86 is where the theme system landed (the UI registers its own warm
    # "slurmwatch" theme via register_theme), and that alone is the reason for
    # the floor: every widget the dashboard actually mounts -- Digits, Header,
    # ListItem, ListView, RichLog, Static -- predates it. Keep this list matched
    # to the real imports; an earlier version credited the floor with widgets the
    # package does not use, which made it look load-bearing for reasons it was
    # not (issues.md D19). A lower floor would resolve to a visibly degraded UI
    # on a fresh install with no error, because the theme would not register.
    # The floor itself (not just 0.89/8.x) is exercised by CI's
    # test-textual-floor job — a smoke test of the real app, not the test suite
    # (which separately relies on introspection APIs textual only added at 2.0).
    "textual>=0.86,<9",
    # Pure-Python NVML bindings. Installs on any machine (no GPU/driver needed)
    # and no-ops at runtime on CPU-only nodes, so one install works across a
    # mixed cluster; GPU monitoring auto-activates wherever an NVIDIA GPU exists.
    # Declared, though `textual` already pulls it in: `tui.py` imports
    # `rich.text.Text` directly, so rich is a dependency of THIS package and not
    # only of its dependency. Relying on the transitive edge meant
    # `pip install slurmwatch` worked by luck of textual's own requirements --
    # which have moved before (8.2.8 asks for rich>=14.2) and could drop or vendor
    # it. The floor is low on purpose: `rich.text.Text` is one of the oldest stable
    # APIs in the package and textual's own constraint is what binds in practice,
    # so a higher number here would be a fiction that only narrows resolution.
    # Uncapped for the same reason -- textual caps what it needs and a second,
    # stricter ceiling here would fight its resolver for no stated defect.
    "rich>=13",
    "pynvml>=11.5,<12",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/PursuitOfDataScience/slurmwatch"
Repository = "https://github.com/PursuitOfDataScience/slurmwatch.git"
Documentation = "https://github.com/PursuitOfDataScience/slurmwatch#readme"
Issues = "https://github.com/PursuitOfDataScience/slurmwatch/issues"

[project.scripts]
slurmwatch = "slurmwatch.cli:main"
# "sw" is a short alias for the same entry point — same behaviour, less typing.
sw = "slurmwatch.cli:main"

[project.optional-dependencies]
# pynvml is now a hard dependency (see [project].dependencies); this extra is
# kept as a no-op alias so existing `pip install "slurmwatch[nvidia]"` still works.
nvidia = []
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    # A hanging test is otherwise undiagnosable in CI: the job runs to the 6-hour
    # limit and the log is truncated before pytest prints anything about where it
    # stopped. With a per-test deadline the hang becomes a traceback.
    "pytest-timeout>=2.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=4.0",
    "setuptools-scm>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["slurmwatch*"]

[tool.setuptools_scm]

[tool.setuptools.package-data]
slurmwatch = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "C4", "T20", "RUF100"]
# RUF100 (unused `noqa`) holds the SUPPRESSIONS honest -- the one claim in this repo
# that nothing checked. Two directives had gone stale, both BARE (no rationale beside
# them): a `# noqa: F811` on a fixture ruff no longer flags, and a `# noqa: E402` on an
# import after a `sys.path` insert. Each advertised a violation the line does not have.
# Measured on BOTH ends of the dev bound before removing them -- 0.15.18 and 0.16.6
# agree on both -- because a directive one version calls unused can be load-bearing on
# another, and CI resolves the upper end.
#
# NOT done in `nodetop` or `rapidu`, deliberately: every stale directive there carries a
# reviewer note (`# noqa: S603 - fixed argv, never a shell`, `# noqa: BLE001  (a hang is
# worse than a report)`), and this rule would demand deleting the note to satisfy the
# linter. Keeping the rationale is worth more than the tidiness.

[tool.ruff.lint.per-file-ignores]
# Test doubles mirror the pynvml C API (mixedCase) and intentionally ignore
# arguments they must accept to match real signatures.
"tests/*" = ["ARG", "N802", "N815"]
# Developer scripts report progress on stdout.
"assets/*" = ["T201"]
# `cli.py` is where writing to a stream is the job -- 39 builtin prints, all of
# them output. Declared here rather than as a `# ruff: noqa: T201` on line 1 of
# the file, which is where it lived: a file-level directive suppresses the rule
# for the whole module invisibly, does not appear in this table where the lint
# policy is meant to be readable, and is missed by any audit that greps for
# `# noqa` (the substring is not present in `# ruff: noqa`). The sibling package
# with the same need already expresses it exactly this way.
"src/slurmwatch/cli.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# 120s is ~200x the slowest honest test here (the whole suite runs in ~40s), so a
# trip means a hang, not a slow machine. Reported rather than silently retried.
addopts = "-v --tb=short --timeout=120"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["slurmwatch"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
